spring.application.name=api-gateway

server.port=8080
spring.threads.virtual.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0

# Ruta za User Service
spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/users/**

# Ruta za Product Service
spring.cloud.gateway.mvc.routes[1].id=product-service
spring.cloud.gateway.mvc.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/products/**


spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.mvc.routes[3].id=notification-service
spring.cloud.gateway.mvc.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://localhost}:8084
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/notifications/**